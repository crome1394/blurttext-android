# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Only settings that differ from the defaults belong here.

naming:
  MatchingDeclarationName:
    # Files are named for what they do (AGENTS.md), e.g. Theme.kt holds the palettes and theme helpers.
    active: false
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose colors and shapes are PascalCase constants (e.g. SwipeDeletePreview).
    constantPattern: '[A-Z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'

complexity:
  LongParameterList:
    # Composables take state plus one lambda per event, by design.
    ignoreAnnotated: ['Composable']
    ignoreDefaultParameters: true

style:
  MaxLineLength:
    # ktlint owns line length (.editorconfig, 140) and rightly skips raw-string regexes.
    active: false
  ReturnCount:
    # Early-return guards (`?: return`, `if (...) return`) are idiomatic Kotlin and keep nesting flat.
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    # Layout sizes (dp, sp) and palette colors live in composables and theme tables.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
